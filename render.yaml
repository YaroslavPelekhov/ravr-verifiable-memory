services:
  - type: web
    name: ravr-verifiable-memory-v11
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: memory
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RAVR_MEMORY_API_KEY
        sync: false
      - key: RAVR_MEMORY_DB
        value: /data/ravr-memory.sqlite3
      - key: RAVR_MEMORY_PROFILE
        value: certified
