services:
  - type: web
    name: ravr-verifiable-memory-v102
    runtime: docker
    plan: free
    region: frankfurt
    branch: deploy/context-v1.0.2
    healthCheckPath: /health
    envVars:
      - key: RAVR_MEMORY_API_KEY
        sync: false
      - key: RAVR_MEMORY_DB
        value: /tmp/ravr-memory-v102.sqlite3
