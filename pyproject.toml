[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ravr-verifiable-memory"
version = "1.1.0"
description = "Deterministic evidence-only memory service for auditable agent evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.17.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ravr_science"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
