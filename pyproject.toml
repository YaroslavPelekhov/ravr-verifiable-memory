[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ravr-verifiable-memory"
version = "1.0.0"
description = "Deterministic evidence-only memory service for auditable agent evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ravr_science"]

[tool.pytest.ini_options]
pythonpath = ["src"]
